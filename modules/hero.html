<section class="hero" id="home">

    <div class="hero-slider">

        <!-- SLIDE 1 -->
        <article
            class="hero-slide active"
            data-slide-index="0"
        >

            <div class="hero-image-side">

                <div class="hero-image-frame">

                    <img
                        src="assets/hero1.jpg"
                        alt="Restaurant"
                        class="hero-image"
                    >

                </div>

            </div>


            <div class="hero-content-side">

                <div class="hero-content">

                    <h1 data-i18n="hero1Title">
                        Hoş Geldiniz
                    </h1>

                    <p data-i18n="hero1Text">
                        Lezzetin en özel hali.
                    </p>

                    <a
                        href="#about"
                        class="hero-button"
                        data-i18n="about"
                    >
                        Hakkımızda
                    </a>

                </div>

            </div>

        </article>


        <!-- SLIDE 2 -->
        <article
            class="hero-slide"
            data-slide-index="1"
        >

            <div class="hero-image-side">

                <div class="hero-image-frame">

                    <img
                        src="assets/hero2.jpg"
                        alt="Reservation"
                        class="hero-image"
                    >

                </div>

            </div>


            <div class="hero-content-side">

                <div class="hero-content">

                    <h1 data-i18n="hero2Title">
                        Rezervasyon Yap
                    </h1>

                    <p data-i18n="hero2Text">
                        Masanızı kolayca ayırtın.
                    </p>

                    <a
                        href="#reservation"
                        class="hero-button"
                        data-i18n="reservation"
                    >
                        Rezervasyon Yap
                    </a>

                </div>

            </div>

        </article>


        <!-- SLIDE 3 -->
        <article
            class="hero-slide"
            data-slide-index="2"
        >

            <div class="hero-image-side">

                <div class="hero-image-frame">

                    <img
                        src="assets/hero3.jpg"
                        alt="Restaurant Food"
                        class="hero-image"
                    >

                </div>

            </div>


            <div class="hero-content-side">

                <div class="hero-content">

                    <h1 data-i18n="hero3Title">
                        Yemeklerimizi Keşfedin
                    </h1>

                    <p data-i18n="hero3Text">
                        Özenle hazırlanan lezzetleri keşfedin.
                    </p>

                    <a
                        href="#menu"
                        class="hero-button"
                        data-i18n="menu"
                    >
                        Menü
                    </a>

                </div>

            </div>

        </article>

    </div>


    <!-- DOTS -->
    <div class="hero-dots">

        <button
            type="button"
            class="hero-dot active"
            data-slide="0"
            aria-label="Slide 1"
        ></button>

        <button
            type="button"
            class="hero-dot"
            data-slide="1"
            aria-label="Slide 2"
        ></button>

        <button
            type="button"
            class="hero-dot"
            data-slide="2"
            aria-label="Slide 3"
        ></button>

    </div>

</section>
