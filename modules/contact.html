<section class="contact-section" id="contact">

    <div class="contact-container">

        <div class="contact-header">

            <span
                class="contact-small-title"
                data-i18n="contactSmallTitle"
            >
                İLETİŞİM
            </span>

            <h2 data-i18n="contactTitle">
                Bize Ulaşın
            </h2>

            <p data-i18n="contactText">
                Sorularınız, rezervasyon ve diğer detaylar için bizimle iletişime geçebilirsiniz.
            </p>

        </div>


        <div class="contact-grid">

            <!-- PHONE -->
            <a
                href="tel:+905551234567"
                class="contact-card"
            >

                <div class="contact-icon">
                    ☎
                </div>

                <h3 data-i18n="contactPhoneTitle">
                    Telefon
                </h3>

                <span>
                    +90 555 123 45 67
                </span>

            </a>


            <!-- EMAIL -->
            <a
                href="mailto:info@restaurant.com"
                class="contact-card"
            >

                <div class="contact-icon">
                    ✉
                </div>

                <h3 data-i18n="contactEmailTitle">
                    E-posta
                </h3>

                <span>
                    info@restaurant.com
                </span>

            </a>


            <!-- LOCATION -->
            <div class="contact-card">

                <div class="contact-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="contact-location-icon"
                    >
                        <path
                            d="M12 21s-6-4.35-6-10a6 6 0 1 1 12 0c0 5.65-6 10-6 10z"
                        ></path>

                        <circle
                            cx="12"
                            cy="11"
                            r="2.2"
                        ></circle>
                    </svg>

                </div>

                <h3 data-i18n="contactAddressTitle">
                    Adres
                </h3>

                <span>
                    İstanbul, Türkiye
                </span>

            </div>

        </div>

    </div>

</section>
